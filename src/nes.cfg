# Boulder Dash (USA): MMC1 (NES 2.0 submapper 5), fixed 32 KB PRG, 32 KB CHR

MEMORY {
    HDR: start = $0000, size = $0010, fill = yes, file = %O;
    PRG: start = $8000, size = $8000, fill = yes, fillval = $FF, file = %O;
    CHR: start = $0000, size = $8000, fill = yes, file = %O;
}

SEGMENTS {
    HEADER: load = HDR, type = ro;
    PRG:    load = PRG, type = ro;
    CHR:    load = CHR, type = ro;
}
